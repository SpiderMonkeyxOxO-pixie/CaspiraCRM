services:
  db:
    image: postgres:17-alpine
    container_name: caspira-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: caspira
      POSTGRES_PASSWORD: caspira_dev_password
      POSTGRES_DB: caspira_crm
      # Local dev only — Docker Desktop's WSL2 NAT changes the source IP
      # Postgres sees, so scram-sha-256 host connections from outside the
      # container can fail auth even with correct credentials. `trust`
      # sidesteps that; never use this for a database reachable off-machine.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      # Localhost-only — never bind a dev database to 0.0.0.0. Host port
      # 5434, not 5432/5433: this machine already runs TWO native
      # (non-Docker) PostgreSQL Windows services — v16 on 127.0.0.1:5432
      # and v18 on 127.0.0.1:5433 — both real conflicts, confirmed via
      # Get-NetTCPConnection, not a Docker networking bug. In-container/
      # in-network traffic (api, worker) still reaches this service at the
      # unaffected internal address `db:5432`.
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - caspira_crm_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caspira -d caspira_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: caspira-crm-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No named volume — BullMQ job state and rate-limit counters are all
    # short-lived and fine to lose on a restart; nothing here needs to
    # survive `docker compose down`.

  mailpit:
    image: axllent/mailpit:latest
    container_name: caspira-crm-mailpit
    restart: unless-stopped
    ports:
      # SMTP defaults to 1026, not the commonly-suggested 1025 — this
      # machine already runs an unrelated project's mail-catcher on 1025.
      # Both ports are configurable via MAILPIT_SMTP_PORT/MAILPIT_UI_PORT.
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1026}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8025/"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      target: runtime
    container_name: caspira-crm-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Everything (including AI provider keys) is read from server/.env — the
    # same file used for local `node --watch` dev outside Docker, so a key
    # only ever needs to be pasted in one place. DATABASE_URL/REDIS_URL/
    # SMTP_HOST are the exceptions: they must point at each service's
    # in-network hostname here, not localhost, so they're overridden below
    # (env_file values are overridden by an explicit `environment:` entry of
    # the same name).
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: "postgresql://caspira:caspira_dev_password@db:5432/caspira_crm?schema=public"
      REDIS_URL: "redis://redis:6379"
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    volumes:
      - ./server/src:/app/src
      - ./server/prisma:/app/prisma
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  worker:
    build:
      context: ./server
      target: runtime
    container_name: caspira-crm-worker
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: "postgresql://caspira:caspira_dev_password@db:5432/caspira_crm?schema=public"
      REDIS_URL: "redis://redis:6379"
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      WORKER_PORT: "4001"
    volumes:
      - ./server/src:/app/src
      - ./server/prisma:/app/prisma
    healthcheck:
      test: ["CMD", "node", "src/workerHealthcheck.js"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  # ---- Backend Phase 11: optional observability profile -------------------
  # Not started by default. `docker compose --profile observability up -d`
  # adds Prometheus (scraping the API's aggregate AI metrics at /metrics) and
  # Grafana with a provisioned "Caspira AI operations" dashboard. Alerts are
  # handled in the CRM (AI Monitoring) and sent through its notification
  # outbox; no Alertmanager or log aggregation is added.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: caspira-crm-prometheus
    profiles: ["observability"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.2.0
    container_name: caspira-crm-grafana
    profiles: ["observability"]
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-change-me-locally}"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caspira_crm_db_data:
