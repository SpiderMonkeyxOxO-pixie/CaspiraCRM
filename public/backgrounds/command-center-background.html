<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050b15" />
  <title>Caspira CRM Animated Background</title>
  <style>
    :root {
      color-scheme: dark;
      --navy-950: #050b15;
      --navy-900: #07111f;
      --navy-800: #0b1b34;
      --blue: #57a7ff;
      --teal: #5ee6c3;
      --violet: #8b7cff;
      --ice: #b7e8ff;
      --mx: 0px;
      --my: 0px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--navy-950);
    }

    /*
      Background-only component.
      When integrating it into another page, place your content after this
      element and give that content position: relative; z-index: 1.
    */
    .caspira-background {
      position: fixed;
      inset: 0;
      isolation: isolate;
      overflow: hidden;
      pointer-events: none;
      background: #03070d;
    }

    .photo-layer {
      position: absolute;
      z-index: 0;
      inset: 0;
      background-image: url("./login-photo-layer.png");
      background-position: center center;
      background-size: cover;
      filter: saturate(.92) contrast(1.035) brightness(.96);
      transform: none;
    }

    .photo-layer::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(1, 5, 11, .2) 0%, rgba(1, 5, 11, .05) 48%, transparent 75%),
        linear-gradient(180deg, rgba(1, 4, 9, .08), transparent 40%, rgba(1, 5, 10, .16));
    }

    .window-reflection {
      position: absolute;
      z-index: 2;
      inset: -25%;
      opacity: .18;
      mix-blend-mode: screen;
      background:
        linear-gradient(108deg, transparent 34%, rgba(190, 229, 243, .045) 43%, transparent 51%),
        linear-gradient(108deg, transparent 58%, rgba(120, 199, 230, .035) 64%, transparent 70%);
      transform: translateX(-10%);
      animation: reflection-pass 18s ease-in-out infinite alternate;
    }

    .rain-glass {
      position: absolute;
      z-index: 6;
      inset: -10%;
      opacity: .105;
      mix-blend-mode: screen;
      background-image:
        repeating-linear-gradient(100deg, transparent 0 74px, rgba(181, 227, 243, .16) 75px, transparent 76px 139px),
        repeating-linear-gradient(96deg, transparent 0 113px, rgba(202, 239, 249, .1) 114px, transparent 115px 191px);
      background-size: 270px 430px, 410px 660px;
      mask-image: linear-gradient(90deg, transparent 0 54%, #000 68% 100%);
      filter: blur(.35px);
      animation: rain-fall 3.8s linear infinite;
    }

    .glass-bloom {
      position: absolute;
      z-index: 6;
      width: 34vw;
      aspect-ratio: 1;
      right: -8vw;
      top: -16vw;
      border-radius: 50%;
      opacity: .16;
      background: radial-gradient(circle, rgba(186, 232, 255, .2), rgba(57, 149, 206, .05) 32%, transparent 68%);
      filter: blur(24px);
      animation: realistic-bloom 9s ease-in-out infinite;
    }

    /* The photographic plate already contains the architecture and hologram. */
    .aurora-field,
    .grid,
    .scanline,
    .ambient-light,
    .globe,
    .radar-sweep,
    .orbit-system,
    .prism-flare {
      display: none;
    }

    #caspira-particles {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      opacity: .36;
      transform: translate3d(calc(var(--mx) * -.16), calc(var(--my) * -.16), 0)
        scale(1.025);
      transition: transform 420ms cubic-bezier(.2,.8,.2,1);
    }

    #hologram-globe {
      display: none;
    }

    #realistic-globe {
      position: absolute;
      z-index: 5;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: .9;
      mix-blend-mode: screen;
      filter: saturate(1.04) drop-shadow(0 0 12px rgba(42, 174, 220, .12));
    }

    .aurora-field {
      position: absolute;
      z-index: 1;
      inset: -26%;
      overflow: hidden;
      opacity: .72;
      filter: blur(54px) saturate(120%);
      mix-blend-mode: screen;
      transform: translate3d(calc(var(--mx) * -.06), calc(var(--my) * -.06), 0);
      transition: transform 700ms cubic-bezier(.2,.8,.2,1);
    }

    .aurora {
      position: absolute;
      width: 74%;
      height: 34%;
      border-radius: 50%;
      opacity: .28;
      transform-origin: center;
    }

    .aurora.a {
      top: 16%;
      right: -4%;
      background: linear-gradient(90deg, transparent, rgba(47, 172, 255, .64), rgba(79, 241, 200, .34), transparent);
      animation: aurora-a 17s ease-in-out infinite alternate;
    }

    .aurora.b {
      right: 18%;
      bottom: 2%;
      background: linear-gradient(90deg, transparent, rgba(99, 99, 255, .38), rgba(41, 182, 226, .36), transparent);
      animation: aurora-b 23s ease-in-out infinite alternate;
    }

    .aurora.c {
      top: 37%;
      left: -22%;
      width: 58%;
      background: linear-gradient(90deg, transparent, rgba(38, 126, 218, .22), rgba(82, 229, 202, .13), transparent);
      animation: aurora-c 19s ease-in-out infinite alternate;
    }

    .grid {
      position: absolute;
      z-index: 2;
      inset: -20%;
      opacity: .31;
      background-image:
        linear-gradient(rgba(78, 130, 191, .075) 1px, transparent 1px),
        linear-gradient(90deg, rgba(78, 130, 191, .075) 1px, transparent 1px);
      background-size: 58px 58px;
      mask-image: radial-gradient(ellipse at 49% 57%, #000 4%, transparent 73%);
      animation: grid-drift 24s linear infinite;
    }

    .scanline {
      position: absolute;
      z-index: 3;
      inset-inline: 0;
      top: -18%;
      height: 18%;
      opacity: .23;
      background: linear-gradient(transparent, rgba(72, 166, 255, .09), transparent);
      animation: scan 10s linear infinite;
    }

    .ambient-light {
      position: absolute;
      z-index: 3;
      width: min(70vw, 1000px);
      aspect-ratio: 1;
      top: 6%;
      right: -28%;
      border-radius: 50%;
      opacity: .45;
      background: radial-gradient(circle, rgba(56, 174, 221, .2), rgba(17, 73, 126, .08) 35%, transparent 69%);
      filter: blur(12px);
      animation: ambient-drift 12s ease-in-out infinite alternate;
    }

    .globe {
      position: absolute;
      z-index: 4;
      width: min(68vw, 940px);
      aspect-ratio: 1;
      right: -24vw;
      bottom: -49%;
      border: 1px solid rgba(93, 192, 255, .18);
      border-radius: 50%;
      opacity: .57;
      background:
        radial-gradient(circle at 34% 27%, rgba(96, 220, 210, .09), transparent 15%),
        repeating-radial-gradient(circle at 50% 50%, transparent 0 45px,
          rgba(64, 148, 211, .055) 46px 47px),
        radial-gradient(circle at 36% 32%, rgba(33, 116, 185, .31), #071425 59%, #030812 75%);
      box-shadow:
        inset 24px 28px 100px rgba(62, 167, 227, .14),
        0 -4px 60px rgba(67, 165, 255, .12);
      animation: globe-breathe 9s ease-in-out infinite;
    }

    .globe::before,
    .globe::after {
      content: "";
      position: absolute;
      inset: 11%;
      border: 1px solid rgba(96, 195, 255, .11);
      border-radius: 50%;
      transform: rotate(19deg) scaleY(.38);
    }

    .globe::after {
      transform: rotate(104deg) scaleY(.31);
    }

    .radar-sweep {
      position: absolute;
      z-index: 4;
      width: min(68vw, 940px);
      aspect-ratio: 1;
      right: -24vw;
      bottom: -49%;
      border-radius: 50%;
      opacity: .11;
      background: conic-gradient(
        from 20deg,
        transparent 0 73%,
        rgba(92, 216, 255, .02) 79%,
        rgba(92, 216, 255, .34) 86%,
        transparent 89% 100%
      );
      mask-image: radial-gradient(circle, transparent 0 22%, #000 55%, transparent 75%);
      animation: radar-turn 18s linear infinite;
    }

    .orbit-system {
      position: absolute;
      z-index: 4;
      top: 3%;
      right: -8%;
      width: min(58vw, 820px);
      aspect-ratio: 1.6;
      opacity: .3;
      transform: perspective(900px) rotateX(67deg) rotateZ(-9deg)
        translate3d(calc(var(--mx) * -.05), calc(var(--my) * -.05), 0);
      transform-style: preserve-3d;
      transition: transform 700ms cubic-bezier(.2,.8,.2,1);
    }

    .orbit {
      position: absolute;
      inset: var(--inset, 8%);
      border: 1px solid rgba(101, 205, 255, .14);
      border-radius: 50%;
      box-shadow: inset 0 0 30px rgba(53, 160, 230, .025);
      animation: orbit-pulse var(--duration, 8s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }

    .orbit::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ice);
      box-shadow: 0 0 8px #75dfff, 0 0 24px rgba(84, 212, 255, .6);
      offset-path: ellipse(50% 50% at 50% 50%);
      offset-distance: 0%;
      offset-rotate: 0deg;
      animation: orbit-spark var(--spark, 13s) linear infinite;
    }

    .prism-flare {
      position: absolute;
      z-index: 6;
      top: 17%;
      right: 12%;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: white;
      opacity: .6;
      box-shadow:
        0 0 8px 2px rgba(152, 229, 255, .95),
        0 0 34px 12px rgba(66, 182, 255, .23),
        0 0 90px 30px rgba(88, 93, 255, .11);
      animation: flare-breathe 6s ease-in-out infinite;
      transform: translate3d(calc(var(--mx) * -.3), calc(var(--my) * -.3), 0);
    }

    .prism-flare::before,
    .prism-flare::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      translate: -50% -50%;
      background: linear-gradient(90deg, transparent, rgba(150, 227, 255, .7), transparent);
    }

    .prism-flare::before { width: 160px; height: 1px; }
    .prism-flare::after { width: 1px; height: 110px; }

    .network {
      position: absolute;
      z-index: 5;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      transform: translate3d(calc(var(--mx) * -.1), calc(var(--my) * -.1), 0);
      transition: transform 500ms cubic-bezier(.2,.8,.2,1);
      opacity: .2;
      mix-blend-mode: screen;
      display: none;
    }

    .route-base,
    .route-flow {
      fill: none;
      vector-effect: non-scaling-stroke;
    }

    .route-base {
      stroke: rgba(79, 147, 228, .24);
      stroke-width: 1.35;
      stroke-dasharray: 2 10;
    }

    .route-flow {
      stroke: url(#route-gradient);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-dasharray: 2 48;
      filter: url(#route-glow);
      animation: data-flow var(--speed, 8s) linear infinite;
      animation-delay: var(--delay, 0s);
    }

    .traveler {
      fill: #78f2d2;
      filter: url(#node-glow);
      opacity: .9;
    }

    .node .halo {
      fill: rgba(95, 229, 195, .08);
      stroke: rgba(95, 229, 195, .14);
      transform-box: fill-box;
      transform-origin: center;
      animation: halo 3.4s ease-out infinite;
      animation-delay: var(--delay, 0s);
    }

    .node .dot {
      fill: #64e8c5;
      filter: url(#node-glow);
      animation: dot-pulse 2.2s ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }

    .vignette {
      position: absolute;
      z-index: 7;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(1, 4, 10, .13), transparent 53%, rgba(2, 6, 12, .04)),
        radial-gradient(ellipse at center, transparent 47%, rgba(1, 4, 9, .38) 118%);
    }

    .signal-layer {
      position: absolute;
      z-index: 6;
      inset: 0;
      overflow: hidden;
      display: none;
    }

    .signal-burst {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: 10px;
      height: 10px;
      translate: -50% -50%;
      border: 1px solid rgba(98, 232, 204, .28);
      border-radius: 50%;
      box-shadow: 0 0 16px rgba(98, 232, 204, .12);
      animation: signal-burst 4.2s cubic-bezier(.12,.58,.2,1) forwards;
    }

    .signal-burst::after {
      content: "";
      position: absolute;
      inset: -1px;
      border: 1px solid rgba(89, 168, 255, .2);
      border-radius: inherit;
      animation: signal-burst 4.2s .55s cubic-bezier(.12,.58,.2,1) forwards;
    }

    .grain {
      position: absolute;
      z-index: 8;
      inset: 0;
      opacity: .022;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
      animation: grain-shift .25s steps(2) infinite;
    }

    @keyframes data-flow { to { stroke-dashoffset: -200; } }
    @keyframes camera-breathe {
      0% { scale: 1; }
      100% { scale: 1.018; translate: -.35% -.2%; }
    }
    @keyframes reflection-pass {
      to { transform: translateX(11%); opacity: .28; }
    }
    @keyframes rain-fall {
      to { background-position: -28px 430px, 22px 660px; }
    }
    @keyframes realistic-bloom {
      50% { opacity: .25; scale: 1.08; }
    }
    @keyframes grid-drift { to { transform: translate3d(58px, 58px, 0); } }
    @keyframes scan { to { top: 116%; } }
    @keyframes ambient-drift { to { translate: -5% 4%; scale: 1.08; } }
    @keyframes globe-breathe { 50% { opacity: .68; transform: scale(1.018); } }
    @keyframes radar-turn { to { transform: rotate(360deg); } }
    @keyframes aurora-a { to { transform: translate(-9%, 13%) rotate(-8deg) scale(1.14, .88); } }
    @keyframes aurora-b { to { transform: translate(13%, -9%) rotate(7deg) scale(.92, 1.16); } }
    @keyframes aurora-c { to { transform: translate(16%, -12%) rotate(5deg) scale(1.12, .94); } }
    @keyframes orbit-pulse { 50% { opacity: .44; transform: scale(1.025); } }
    @keyframes orbit-spark { to { offset-distance: 100%; } }
    @keyframes flare-breathe { 50% { opacity: .95; scale: 1.25; } }
    @keyframes signal-burst {
      0% { opacity: 0; transform: scale(.2); }
      14% { opacity: .34; }
      100% { opacity: 0; transform: scale(8); }
    }
    @keyframes dot-pulse { 50% { opacity: .48; } }
    @keyframes halo {
      0% { opacity: .8; transform: scale(.3); }
      75%, 100% { opacity: 0; transform: scale(2.7); }
    }
    @keyframes grain-shift {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-1%, 1%); }
      50% { transform: translate(1%, -1%); }
      75% { transform: translate(1%, 1%); }
      100% { transform: translate(-1%, -1%); }
    }

    @media (max-width: 850px) {
      .network { width: 145%; left: -23%; opacity: .88; }
      .globe { width: 920px; right: -620px; bottom: -35%; }
      .radar-sweep { width: 920px; right: -620px; bottom: -35%; }
      .orbit-system { right: -42%; width: 930px; }
    }

    @media (max-width: 520px) {
      .network { width: 190%; left: -44%; opacity: .7; }
      .globe { right: -710px; }
      .radar-sweep { right: -710px; }
      .orbit-system { right: -590px; opacity: .2; }
      .prism-flare { right: 7%; opacity: .4; }
      .grain { opacity: .025; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
      }
      #caspira-particles,
      .network,
      .photo-layer,
      #hologram-globe,
      #realistic-globe {
        transform: none !important;
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="caspira-background" id="caspira-background" aria-hidden="true">
    <div class="photo-layer"></div>
    <div class="window-reflection"></div>
    <canvas id="caspira-particles"></canvas>
    <canvas id="hologram-globe"></canvas>
    <canvas id="realistic-globe"></canvas>
    <div class="aurora-field">
      <i class="aurora a"></i>
      <i class="aurora b"></i>
      <i class="aurora c"></i>
    </div>
    <div class="grid"></div>
    <div class="scanline"></div>
    <div class="ambient-light"></div>
    <div class="globe"></div>
    <div class="radar-sweep"></div>
    <div class="orbit-system">
      <i class="orbit" style="--inset:4%;--duration:9s;--spark:14s"></i>
      <i class="orbit" style="--inset:17%;--duration:11s;--delay:-4s;--spark:19s"></i>
      <i class="orbit" style="--inset:31%;--duration:7s;--delay:-2s;--spark:11s"></i>
    </div>
    <div class="prism-flare"></div>
    <div class="rain-glass"></div>
    <div class="glass-bloom"></div>

    <svg class="network" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="route-gradient" x1="0" x2="1">
          <stop offset="0" stop-color="#479fff" stop-opacity=".16" />
          <stop offset=".55" stop-color="#65b7ff" stop-opacity=".88" />
          <stop offset="1" stop-color="#67e6c4" stop-opacity=".78" />
        </linearGradient>
        <filter id="route-glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="2.3" result="blur" />
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="node-glow" x="-300%" y="-300%" width="600%" height="600%">
          <feGaussianBlur stdDeviation="5" result="blur" />
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <path id="path-a" d="M138 452 Q 464 238 734 356" />
        <path id="path-b" d="M138 452 Q 628 414 1037 502" />
        <path id="path-c" d="M734 356 Q 951 373 1037 502" />
        <path id="path-d" d="M1037 502 Q 1307 570 1420 748" />
        <path id="path-e" d="M1420 748 Q 1504 531 1628 474" />
        <path id="path-f" d="M620 342 Q 1160 307 1420 748" />
      </defs>

      <g opacity=".97">
        <use href="#path-a" class="route-base" />
        <use href="#path-a" class="route-flow" style="--speed:8s" />
        <use href="#path-b" class="route-base" />
        <use href="#path-b" class="route-flow" style="--speed:10s;--delay:-3s" />
        <use href="#path-c" class="route-base" />
        <use href="#path-c" class="route-flow" style="--speed:6s;--delay:-1s" />
        <use href="#path-d" class="route-base" />
        <use href="#path-d" class="route-flow" style="--speed:9s;--delay:-4s" />
        <use href="#path-e" class="route-base" />
        <use href="#path-e" class="route-flow" style="--speed:7s;--delay:-2s" />
        <use href="#path-f" class="route-base" />
        <use href="#path-f" class="route-flow" style="--speed:12s;--delay:-6s" />
      </g>

      <g opacity=".32" transform="translate(1160 490) rotate(-14)">
        <ellipse class="route-base" rx="510" ry="112" />
        <ellipse class="route-flow" rx="510" ry="112" style="--speed:15s;--delay:-8s" />
      </g>

      <g opacity=".18" transform="translate(1220 525) rotate(17)">
        <ellipse class="route-base" rx="420" ry="78" />
        <ellipse class="route-flow" rx="420" ry="78" style="--speed:18s;--delay:-5s" />
      </g>

      <g class="node" style="--delay:-.2s" transform="translate(138 452)">
        <circle class="halo" r="15"/><circle class="dot" r="5"/>
      </g>
      <g class="node" style="--delay:-1.1s" transform="translate(620 342)">
        <circle class="halo" r="15"/><circle class="dot" r="5"/>
      </g>
      <g class="node" style="--delay:-2.1s" transform="translate(734 356)">
        <circle class="halo" r="15"/><circle class="dot" r="5"/>
      </g>
      <g class="node" style="--delay:-.7s" transform="translate(1037 502)">
        <circle class="halo" r="15"/><circle class="dot" r="5"/>
      </g>
      <g class="node" style="--delay:-1.6s" transform="translate(1420 748)">
        <circle class="halo" r="15"/><circle class="dot" r="5"/>
      </g>
      <g class="node" style="--delay:-2.6s" transform="translate(1628 474)">
        <circle class="halo" r="15"/><circle class="dot" r="5"/>
      </g>

      <circle class="traveler" r="3.2">
        <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#path-a"/></animateMotion>
      </circle>
      <circle class="traveler" r="3">
        <animateMotion dur="8s" begin="-4s" repeatCount="indefinite"><mpath href="#path-b"/></animateMotion>
      </circle>
      <circle class="traveler" r="3.4">
        <animateMotion dur="7s" begin="-2s" repeatCount="indefinite"><mpath href="#path-d"/></animateMotion>
      </circle>
      <circle class="traveler" r="2.8">
        <animateMotion dur="9s" begin="-6s" repeatCount="indefinite"><mpath href="#path-f"/></animateMotion>
      </circle>
    </svg>

    <div class="signal-layer" id="signal-layer"></div>
    <div class="vignette"></div>
    <div class="grain"></div>
  </div>

  <script>
    (() => {
      const background = document.getElementById('caspira-background');
      const canvas = document.getElementById('caspira-particles');
      const globeCanvas = document.getElementById('hologram-globe');
      const realisticCanvas = document.getElementById('realistic-globe');
      const signalLayer = document.getElementById('signal-layer');
      const ctx = canvas.getContext('2d', { alpha: true });
      const globeCtx = globeCanvas.getContext('2d', { alpha: true });
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const DEG = Math.PI / 180;
      const PHOTO_WIDTH = 1535;
      const PHOTO_HEIGHT = 1024;
      const TILT = -7 * DEG;
      const tiltCos = Math.cos(TILT);
      const tiltSin = Math.sin(TILT);
      const EARTH_TEXTURE = "./login-earth-texture.png";
      let width = 0;
      let height = 0;
      let dpr = 1;
      let raf = 0;
      let active = true;
      let particles = [];
      let globeGeometry = { cx: 0, cy: 0, radius: 0, scale: 1, ox: 0, oy: 0 };
      let renderRealisticGlobe = () => {};

      const continents = [
        [
          [-168, 71], [-151, 72], [-139, 67], [-130, 58], [-123, 50],
          [-125, 42], [-117, 32], [-107, 28], [-98, 19], [-88, 18],
          [-82, 25], [-80, 32], [-72, 42], [-59, 49], [-61, 58],
          [-77, 64], [-91, 70], [-112, 73], [-135, 69], [-154, 76]
        ],
        [
          [-82, 12], [-72, 10], [-61, 6], [-50, 1], [-36, -5],
          [-39, -16], [-48, -26], [-53, -36], [-61, -53], [-70, -55],
          [-75, -42], [-70, -27], [-75, -12], [-80, 0]
        ],
        [
          [-17, 37], [-2, 36], [12, 38], [26, 33], [35, 28], [43, 12],
          [51, 10], [45, -13], [34, -30], [25, -35], [15, -32], [4, -20],
          [-7, -4], [-16, 14]
        ],
        [
          [-11, 36], [-7, 44], [-11, 52], [-3, 59], [8, 71], [25, 71],
          [39, 61], [34, 52], [42, 45], [30, 37], [18, 35], [8, 39]
        ],
        [
          [26, 70], [52, 77], [89, 78], [121, 72], [151, 61], [179, 58],
          [169, 47], [150, 39], [142, 29], [126, 20], [119, 8], [104, 2],
          [91, 9], [82, 22], [72, 18], [62, 25], [51, 30], [39, 41], [35, 56]
        ],
        [
          [68, 25], [77, 29], [88, 25], [91, 20], [85, 8], [78, 6],
          [73, 16]
        ],
        [
          [112, -11], [126, -12], [139, -17], [153, -28], [146, -39],
          [132, -43], [116, -35], [113, -23]
        ],
        [
          [-73, 83], [-20, 82], [-11, 72], [-24, 60], [-48, 59],
          [-62, 68]
        ],
        [
          [95, 5], [108, 3], [119, -2], [129, -4], [141, -8], [132, -11],
          [116, -8], [103, -5]
        ],
        [
          [129, 33], [136, 35], [142, 44], [146, 45], [142, 35], [136, 31]
        ]
      ];

      const routes = [
        [[51.5, -0.1], [25.2, 55.3], .04],
        [[25.2, 55.3], [1.3, 103.8], .26],
        [[40.7, -74], [51.5, -0.1], .51],
        [[35.7, 139.7], [1.3, 103.8], .7],
        [[19.4, -99.1], [-23.5, -46.6], .84],
        [[-33.9, 151.2], [1.3, 103.8], .12]
      ];

      function insidePolygon(lon, lat, polygon) {
        let inside = false;
        for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
          const xi = polygon[i][0];
          const yi = polygon[i][1];
          const xj = polygon[j][0];
          const yj = polygon[j][1];
          const intersects = ((yi > lat) !== (yj > lat)) &&
            (lon < (xj - xi) * (lat - yi) / ((yj - yi) || .00001) + xi);
          if (intersects) inside = !inside;
        }
        return inside;
      }

      const landPoints = [];
      for (let lat = -57; lat <= 82; lat += 1.85) {
        for (let lon = -179; lon < 180; lon += 1.85) {
          const jitterLon = lon + (Math.random() - .5) * .9;
          const jitterLat = lat + (Math.random() - .5) * .9;
          if (continents.some((shape) => insidePolygon(jitterLon, jitterLat, shape))) {
            landPoints.push({
              lat: jitterLat,
              lon: jitterLon,
              size: .48 + Math.random() * .78,
              pulse: Math.random() * Math.PI * 2
            });
          }
        }
      }

      function initRealisticGlobe() {
        const gl = realisticCanvas.getContext('webgl', {
          alpha: true,
          antialias: true,
          depth: true,
          premultipliedAlpha: false,
          powerPreference: 'high-performance'
        });

        if (!gl) {
          realisticCanvas.style.display = 'none';
          globeCanvas.style.display = 'block';
          return (time) => drawGlobe(time);
        }

        const vertexSource = `
          attribute vec3 aPosition;
          attribute vec2 aUv;
          uniform vec2 uCenter;
          uniform vec2 uScale;
          uniform float uRotation;
          uniform float uTilt;
          varying vec2 vUv;
          varying vec3 vNormal;

          void main() {
            float cr = cos(uRotation);
            float sr = sin(uRotation);
            vec3 p = aPosition;
            p = vec3(
              p.x * cr + p.z * sr,
              p.y,
              -p.x * sr + p.z * cr
            );

            float ct = cos(uTilt);
            float st = sin(uTilt);
            p = vec3(
              p.x,
              p.y * ct - p.z * st,
              p.y * st + p.z * ct
            );

            vUv = aUv;
            vNormal = normalize(p);
            gl_Position = vec4(
              uCenter + vec2(p.x * uScale.x, p.y * uScale.y),
              -p.z * 0.18,
              1.0
            );
          }
        `;

        const fragmentSource = `
          precision highp float;
          uniform sampler2D uMap;
          uniform float uTime;
          varying vec2 vUv;
          varying vec3 vNormal;

          void main() {
            vec3 normal = normalize(vNormal);
            float facing = max(normal.z, 0.0);
            if (facing <= 0.001) discard;

            vec3 earth = texture2D(uMap, vUv).rgb;
            float luminance = dot(earth, vec3(0.2126, 0.7152, 0.0722));
            float terrain = smoothstep(0.018, 0.15, max(earth.b, luminance));
            float city = smoothstep(0.34, 0.82, luminance);

            vec3 lightDirection = normalize(vec3(-0.34, 0.48, 0.81));
            float diffuse = 0.38 + 0.62 * max(dot(normal, lightDirection), 0.0);
            float fresnel = pow(1.0 - facing, 3.15);
            float glassDepth = smoothstep(0.0, 0.3, facing);

            vec3 terrainColor = vec3(0.10, 0.62, 0.78) * terrain * diffuse;
            vec3 cityColor = vec3(0.60, 0.92, 0.94) * city * 1.18;
            vec3 atmosphere = vec3(0.14, 0.70, 0.90) * fresnel * 0.72;
            float scan = 0.985 + 0.015 * sin(gl_FragCoord.y * 1.75 + uTime * 1.4);

            vec3 color = (terrainColor + cityColor + atmosphere) * scan;
            float alpha = (
              0.014 +
              terrain * 0.29 +
              city * 0.38 +
              fresnel * 0.21
            ) * glassDepth;

            gl_FragColor = vec4(color, clamp(alpha, 0.0, 0.76));
          }
        `;

        function compile(type, source) {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, source);
          gl.compileShader(shader);
          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(shader) || 'Globe shader compilation failed');
          }
          return shader;
        }

        const program = gl.createProgram();
        gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
        gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSource));
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          throw new Error(gl.getProgramInfoLog(program) || 'Globe program link failed');
        }

        const latitudeSegments = 72;
        const longitudeSegments = 112;
        const positions = [];
        const uvs = [];
        const indices = [];

        for (let y = 0; y <= latitudeSegments; y += 1) {
          const v = y / latitudeSegments;
          const latitude = Math.PI * .5 - v * Math.PI;
          const cosLatitude = Math.cos(latitude);
          const sinLatitude = Math.sin(latitude);

          for (let x = 0; x <= longitudeSegments; x += 1) {
            const u = x / longitudeSegments;
            const longitude = u * Math.PI * 2 - Math.PI;
            positions.push(
              cosLatitude * Math.sin(longitude),
              sinLatitude,
              cosLatitude * Math.cos(longitude)
            );
            uvs.push(u, v);
          }
        }

        for (let y = 0; y < latitudeSegments; y += 1) {
          for (let x = 0; x < longitudeSegments; x += 1) {
            const row = longitudeSegments + 1;
            const a = y * row + x;
            const b = a + row;
            indices.push(a, b, a + 1, b, b + 1, a + 1);
          }
        }

        function bindAttribute(name, values, size) {
          const buffer = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
          gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(values), gl.STATIC_DRAW);
          const location = gl.getAttribLocation(program, name);
          gl.enableVertexAttribArray(location);
          gl.vertexAttribPointer(location, size, gl.FLOAT, false, 0, 0);
        }

        gl.useProgram(program);
        bindAttribute('aPosition', positions, 3);
        bindAttribute('aUv', uvs, 2);
        const indexBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.STATIC_DRAW);

        const uniforms = {
          center: gl.getUniformLocation(program, 'uCenter'),
          scale: gl.getUniformLocation(program, 'uScale'),
          rotation: gl.getUniformLocation(program, 'uRotation'),
          tilt: gl.getUniformLocation(program, 'uTilt'),
          time: gl.getUniformLocation(program, 'uTime'),
          map: gl.getUniformLocation(program, 'uMap')
        };

        gl.enable(gl.DEPTH_TEST);
        gl.depthFunc(gl.LEQUAL);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.clearColor(0, 0, 0, 0);

        const texture = gl.createTexture();
        const textureImage = new Image();
        let textureReady = false;
        textureImage.onload = () => {
          gl.bindTexture(gl.TEXTURE_2D, texture);
          gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, textureImage);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
          gl.generateMipmap(gl.TEXTURE_2D);
          textureReady = true;
        };
        textureImage.src = EARTH_TEXTURE;

        return (time) => {
          gl.viewport(0, 0, realisticCanvas.width, realisticCanvas.height);
          gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
          if (!textureReady || !globeGeometry.radius) return;

          gl.useProgram(program);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, texture);
          gl.uniform1i(uniforms.map, 0);
          gl.uniform2f(
            uniforms.center,
            globeGeometry.cx * 2 / width - 1,
            1 - globeGeometry.cy * 2 / height
          );
          gl.uniform2f(
            uniforms.scale,
            globeGeometry.radius * 2 / width,
            globeGeometry.radius * 2 / height
          );
          gl.uniform1f(uniforms.rotation, reduceMotion ? -.28 : time * .000074);
          gl.uniform1f(uniforms.tilt, -.13);
          gl.uniform1f(uniforms.time, time * .001);
          gl.drawElements(gl.TRIANGLES, indices.length, gl.UNSIGNED_SHORT, 0);

          gl.enable(gl.SCISSOR_TEST);
          const mullions = [[957, 1004], [1268, 1310], [1475, 1512]];
          for (const [start, end] of mullions) {
            const maskX = Math.round((globeGeometry.ox + start * globeGeometry.scale) * dpr);
            const maskWidth = Math.ceil((end - start) * globeGeometry.scale * dpr);
            gl.scissor(maskX, 0, maskWidth, realisticCanvas.height);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
          }
          gl.disable(gl.SCISSOR_TEST);
        };
      }

      const makeParticle = (randomY = true) => ({
        x: Math.random() * width,
        y: randomY ? Math.random() * height : height + 8,
        r: Math.random() * .8 + .2,
        z: Math.random() * .72 + .28,
        vx: (Math.random() - .5) * .024,
        vy: -(Math.random() * .026 + .008),
        a: Math.random() * .13 + .015,
        twinkle: Math.random() * Math.PI * 2,
        hue: Math.random() > .82 ? '142, 224, 207' : '173, 211, 226'
      });

      function projectGlobe(latDeg, lonDeg, angle) {
        const lat = latDeg * DEG;
        const lon = lonDeg * DEG + angle;
        const cosLat = Math.cos(lat);
        const x = cosLat * Math.sin(lon);
        const rawY = Math.sin(lat);
        const rawZ = cosLat * Math.cos(lon);
        const y = rawY * tiltCos - rawZ * tiltSin;
        const z = rawY * tiltSin + rawZ * tiltCos;
        const perspective = .94 + z * .06;
        return {
          x: globeGeometry.cx + x * globeGeometry.radius * perspective,
          y: globeGeometry.cy - y * globeGeometry.radius * perspective,
          z
        };
      }

      function strokeSphereLine(samples, angle, color, widthValue) {
        globeCtx.beginPath();
        let drawing = false;
        for (const sample of samples) {
          const point = projectGlobe(sample[0], sample[1], angle);
          if (point.z > .015) {
            if (!drawing) globeCtx.moveTo(point.x, point.y);
            else globeCtx.lineTo(point.x, point.y);
            drawing = true;
          } else {
            drawing = false;
          }
        }
        globeCtx.strokeStyle = color;
        globeCtx.lineWidth = widthValue;
        globeCtx.stroke();
      }

      function quadraticPoint(a, control, b, t) {
        const inverse = 1 - t;
        return {
          x: inverse * inverse * a.x + 2 * inverse * t * control.x + t * t * b.x,
          y: inverse * inverse * a.y + 2 * inverse * t * control.y + t * t * b.y
        };
      }

      function maskWindowMullions() {
        const mullions = [
          [957, 1004],
          [1268, 1310],
          [1475, 1512]
        ];
        globeCtx.save();
        globeCtx.globalCompositeOperation = 'destination-out';
        globeCtx.fillStyle = '#000';
        for (const [start, end] of mullions) {
          const x = globeGeometry.ox + start * globeGeometry.scale;
          const mullionWidth = (end - start) * globeGeometry.scale;
          globeCtx.fillRect(x, 0, mullionWidth, height);
        }
        globeCtx.restore();
      }

      function drawGlobe(time) {
        globeCtx.clearRect(0, 0, width, height);
        if (!globeGeometry.radius) return;

        const angle = reduceMotion ? -.2 : time * .000112;
        const { cx, cy, radius } = globeGeometry;

        globeCtx.save();
        globeCtx.globalCompositeOperation = 'lighter';

        const halo = globeCtx.createRadialGradient(cx, cy, radius * .48, cx, cy, radius * 1.08);
        halo.addColorStop(0, 'rgba(23, 150, 205, .018)');
        halo.addColorStop(.72, 'rgba(38, 184, 230, .038)');
        halo.addColorStop(.96, 'rgba(100, 226, 244, .12)');
        halo.addColorStop(1, 'rgba(70, 190, 232, 0)');
        globeCtx.fillStyle = halo;
        globeCtx.beginPath();
        globeCtx.arc(cx, cy, radius * 1.1, 0, Math.PI * 2);
        globeCtx.fill();

        globeCtx.beginPath();
        globeCtx.arc(cx, cy, radius, 0, Math.PI * 2);
        globeCtx.strokeStyle = 'rgba(105, 225, 244, .15)';
        globeCtx.lineWidth = .8;
        globeCtx.stroke();

        for (let lat = -60; lat <= 60; lat += 30) {
          const samples = [];
          for (let lon = -180; lon <= 180; lon += 4) samples.push([lat, lon]);
          strokeSphereLine(samples, angle, 'rgba(79, 194, 230, .07)', .55);
        }

        for (let lon = -150; lon <= 180; lon += 30) {
          const samples = [];
          for (let lat = -86; lat <= 86; lat += 3) samples.push([lat, lon]);
          strokeSphereLine(samples, angle, 'rgba(79, 194, 230, .065)', .5);
        }

        const pointBins = Array.from({ length: 6 }, () => []);
        for (const land of landPoints) {
          const projected = projectGlobe(land.lat, land.lon, angle);
          if (projected.z < -.17) continue;
          const depth = Math.max(0, (projected.z + .17) / 1.17);
          const bin = Math.min(5, Math.floor(depth * 6));
          pointBins[bin].push([projected.x, projected.y, land.size, land.pulse]);
        }

        pointBins.forEach((points, index) => {
          if (!points.length) return;
          const depth = (index + 1) / 6;
          const pulse = .9 + Math.sin(time * .0014 + index) * .1;
          globeCtx.beginPath();
          for (const point of points) {
            const radiusValue = point[2] * (.46 + depth * .72) * pulse;
            globeCtx.moveTo(point[0] + radiusValue, point[1]);
            globeCtx.arc(point[0], point[1], radiusValue, 0, Math.PI * 2);
          }
          globeCtx.fillStyle = `rgba(${63 + index * 6}, ${165 + index * 11}, ${213 + index * 6}, ${.025 + depth * .22})`;
          globeCtx.fill();
        });

        routes.forEach((route, index) => {
          const from = projectGlobe(route[0][0], route[0][1], angle);
          const to = projectGlobe(route[1][0], route[1][1], angle);
          if (from.z < .06 || to.z < .06) return;
          const visibility = Math.min(from.z, to.z);
          const distance = Math.hypot(to.x - from.x, to.y - from.y);
          const control = {
            x: (from.x + to.x) * .5,
            y: (from.y + to.y) * .5 - distance * .29
          };

          globeCtx.beginPath();
          globeCtx.moveTo(from.x, from.y);
          globeCtx.quadraticCurveTo(control.x, control.y, to.x, to.y);
          globeCtx.strokeStyle = `rgba(80, 215, 235, ${.055 + visibility * .16})`;
          globeCtx.lineWidth = .65;
          globeCtx.stroke();

          const travel = (time * .000085 + route[2]) % 1;
          const traveler = quadraticPoint(from, control, to, travel);
          globeCtx.beginPath();
          globeCtx.fillStyle = `rgba(148, 246, 244, ${.3 + visibility * .52})`;
          globeCtx.arc(traveler.x, traveler.y, 1.05 + visibility * .65, 0, Math.PI * 2);
          globeCtx.fill();
        });

        const scanLongitude = ((time * .018) % 360) - 180;
        const scanSamples = [];
        for (let lat = -86; lat <= 86; lat += 2) scanSamples.push([lat, scanLongitude]);
        strokeSphereLine(scanSamples, angle, 'rgba(121, 238, 242, .22)', .75);

        globeCtx.restore();
        maskWindowMullions();
      }

      function resize() {
        const rect = background.getBoundingClientRect();
        dpr = Math.min(devicePixelRatio || 1, 2);
        width = Math.max(1, rect.width);
        height = Math.max(1, rect.height);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        globeCanvas.width = Math.round(width * dpr);
        globeCanvas.height = Math.round(height * dpr);
        realisticCanvas.width = Math.round(width * dpr);
        realisticCanvas.height = Math.round(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        globeCanvas.style.width = width + 'px';
        globeCanvas.style.height = height + 'px';
        realisticCanvas.style.width = width + 'px';
        realisticCanvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        globeCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const imageScale = Math.max(width / PHOTO_WIDTH, height / PHOTO_HEIGHT);
        const renderedWidth = PHOTO_WIDTH * imageScale;
        const renderedHeight = PHOTO_HEIGHT * imageScale;
        const offsetX = (width - renderedWidth) * .5;
        const offsetY = (height - renderedHeight) * .5;
        globeGeometry = {
          cx: offsetX + 1254 * imageScale,
          cy: offsetY + 431 * imageScale,
          radius: 300 * imageScale,
          scale: imageScale,
          ox: offsetX,
          oy: offsetY
        };
        const count = Math.min(72, Math.max(34, Math.round(width * height / 24000)));
        particles = Array.from({ length: count }, () => makeParticle());
      }

      function draw(time = 0) {
        if (!active) return;
        ctx.clearRect(0, 0, width, height);
        renderRealisticGlobe(time);
        for (const particle of particles) {
          if (!reduceMotion) {
            particle.x += particle.vx * particle.z;
            particle.y += particle.vy * particle.z;
            particle.twinkle += .012;
            if (
              particle.y < -8 ||
              particle.x < -8 ||
              particle.x > width + 8
            ) Object.assign(particle, makeParticle(false));
          }

          const alpha = particle.a * (
            .68 + Math.sin(particle.twinkle + time * .00018) * .32
          );
          ctx.beginPath();
          ctx.fillStyle = `rgba(${particle.hue}, ${Math.max(0, alpha)})`;
          ctx.arc(particle.x, particle.y, particle.r * particle.z, 0, Math.PI * 2);
          ctx.fill();
        }
        if (!reduceMotion) raf = requestAnimationFrame(draw);
      }

      function spawnSignal() {
        if (!active || reduceMotion) return;
        const burst = document.createElement('i');
        burst.className = 'signal-burst';
        burst.style.setProperty('--x', `${46 + Math.random() * 50}%`);
        burst.style.setProperty('--y', `${18 + Math.random() * 70}%`);
        signalLayer.appendChild(burst);
        burst.addEventListener('animationend', () => burst.remove(), { once: true });
      }

      renderRealisticGlobe = initRealisticGlobe();
      resize();
      draw();
      addEventListener('resize', resize, { passive: true });

      if (!reduceMotion) {
        setTimeout(spawnSignal, 900);
        setInterval(spawnSignal, 5200);
      }

      if (!reduceMotion) {
        addEventListener('pointermove', (event) => {
          const x = event.clientX / innerWidth - .5;
          const y = event.clientY / innerHeight - .5;
          background.style.setProperty('--mx', `${x * 20}px`);
          background.style.setProperty('--my', `${y * 16}px`);
        }, { passive: true });

        document.addEventListener('pointerleave', () => {
          background.style.setProperty('--mx', '0px');
          background.style.setProperty('--my', '0px');
        });
      }

      document.addEventListener('visibilitychange', () => {
        active = !document.hidden;
        cancelAnimationFrame(raf);
        if (active && !reduceMotion) raf = requestAnimationFrame(draw);
      });
    })();
  </script>
</body>
</html>
