name: Auto Deploy Frontend (Server Build)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy & Build on Server
        run: |
          ssh -o StrictHostKeyChecking=no \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'

          set -e
          cd /www/wwwroot/Internal-Project
          git fetch origin
          git reset --hard origin/main
          git clean -fd
          npm install
          npm run build
          echo "✅ Frontend built"

          # Backend (docs/VPS_PROD_SETUP.md) — only once the production
          # settings exist on the server; until then this step is skipped.
          # `git clean -fd` above never removes the git-ignored .env.
          if [ -f deploy/vps-prod/.env ]; then
            cd deploy/vps-prod
            docker compose up -d --build --wait
            docker compose exec -T api node scripts/seedRoles.js
            docker image prune -f
            echo "✅ Backend updated"
          else
            echo "ℹ️ deploy/vps-prod/.env not found — backend deploy skipped"
          fi
          EOF
