name: Deploy Frontend (manual, approved)

# Backend Phase 13: production deployment requires an explicit, approved
# action — this no longer runs on every push to main. Run it from GitHub →
# Actions → "Deploy Frontend" → Run workflow, typing DEPLOY to confirm. Add
# required reviewers to the "production" environment in the repository
# settings so a second person approves each run. (The controlled,
# digest-pinned deployment in deploy/production replaces this server-side
# build once the new stack is live.)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to deploy the current main branch to the live frontend
        required: true

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy & Build on Server
        run: |
          ssh -o StrictHostKeyChecking=no \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'

          set -e
          cd /www/wwwroot/caspiracrm.caspirasolutions.com
          git fetch origin
          git reset --hard origin/main
          # No `git clean`: the site folder also holds untracked files that
          # must survive a deploy — dist_live/ (what nginx serves),
          # .well-known/ (SSL renewals) and .htaccess.
          npm install
          npm run build
          # nginx serves dist_live/ — swap the new build in as one step.
          rm -rf dist_live.new
          cp -r dist dist_live.new
          rm -rf dist_live
          mv dist_live.new dist_live
          echo "✅ Deploy successful"
          EOF

  # Backend on the database VPS (docs/VPS_PROD_SETUP.md). Skipped until the
  # BACKEND_* secrets are added to the repository.
  deploy-backend:
    runs-on: ubuntu-latest
    env:
      BACKEND_SERVER_IP: ${{ secrets.BACKEND_SERVER_IP }}
    steps:
      - name: Setup SSH
        if: env.BACKEND_SERVER_IP != ''
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BACKEND_SSH_PRIVATE_KEY }}

      - name: Update and restart the backend
        if: env.BACKEND_SERVER_IP != ''
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.BACKEND_SERVER_PORT }} \
          ${{ secrets.BACKEND_SERVER_USER }}@${{ secrets.BACKEND_SERVER_IP }} << 'EOF'

          set -e
          cd /opt/caspira-crm
          git fetch origin
          git reset --hard origin/main
          cd deploy/vps-prod
          docker compose up -d --build --wait
          docker compose exec -T api node scripts/seedRoles.js
          docker image prune -f
          echo "✅ Backend updated"
          EOF

      - name: Backend deploy not configured
        if: env.BACKEND_SERVER_IP == ''
        run: echo "BACKEND_* secrets not set — backend deploy skipped"
