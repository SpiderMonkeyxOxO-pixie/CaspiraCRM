name: Auto Deploy Frontend (Server Build)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy & Build on Server
        run: |
          ssh -o StrictHostKeyChecking=no \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'

          set -e
          cd /www/wwwroot/Internal-Project
          git fetch origin
          git reset --hard origin/main
          git clean -fd
          npm install
          npm run build
          echo "✅ Deploy successful"
          EOF

  # Backend on the database VPS (docs/VPS_PROD_SETUP.md). Skipped until the
  # BACKEND_* secrets are added to the repository.
  deploy-backend:
    runs-on: ubuntu-latest
    env:
      BACKEND_SERVER_IP: ${{ secrets.BACKEND_SERVER_IP }}
    steps:
      - name: Setup SSH
        if: env.BACKEND_SERVER_IP != ''
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BACKEND_SSH_PRIVATE_KEY }}

      - name: Update and restart the backend
        if: env.BACKEND_SERVER_IP != ''
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.BACKEND_SERVER_PORT }} \
          ${{ secrets.BACKEND_SERVER_USER }}@${{ secrets.BACKEND_SERVER_IP }} << 'EOF'

          set -e
          cd /opt/caspira-crm
          git fetch origin
          git reset --hard origin/main
          cd deploy/vps-prod
          docker compose up -d --build --wait
          docker compose exec -T api node scripts/seedRoles.js
          docker image prune -f
          echo "✅ Backend updated"
          EOF

      - name: Backend deploy not configured
        if: env.BACKEND_SERVER_IP == ''
        run: echo "BACKEND_* secrets not set — backend deploy skipped"
