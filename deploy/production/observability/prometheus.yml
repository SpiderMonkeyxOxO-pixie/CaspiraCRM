# Production Prometheus (profile "observability", Backend Phase 13).
# Scrapes the API's aggregate metrics over the internal observability
# network with the metrics token read from the Docker secret file.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    service: caspira-crm
scrape_configs:
  - job_name: caspira-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:4000"]
