# Caspira CRM production PostgreSQL settings (Backend Phase 13).
# Tuned for a single host; revisit sizing in Phase 14 (capacity planning).
listen_addresses = '*'                 # reachable only on the internal "data" network
port = 5432
max_connections = 100
superuser_reserved_connections = 5
unix_socket_directories = '/var/run/postgresql'
password_encryption = scram-sha-256
ssl = off                              # traffic never leaves the internal Docker network

shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 16MB
maintenance_work_mem = 128MB

# Safety limits (runtime roles override with ALTER ROLE … SET)
statement_timeout = 0
lock_timeout = 0
idle_in_transaction_session_timeout = 60s
idle_session_timeout = 0

# Continuous archiving for point-in-time recovery (pgBackRest).
wal_level = replica
archive_mode = on
archive_command = '/opt/caspira/pgbackrest-wrapper.sh --stanza=caspira archive-push %p'
archive_timeout = 300                  # force a segment switch at least every 5 minutes (RPO)
max_wal_senders = 3
wal_compression = on
max_wal_size = 2GB
min_wal_size = 256MB

# Integrity (data checksums are enabled at initdb: --data-checksums)
full_page_writes = on

# Logging: slow queries and lock waits, no statement text with parameters.
logging_collector = off
log_destination = 'stderr'
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 1000      # slow-query log (ms)
log_lock_waits = on
log_temp_files = 10MB
log_checkpoints = on
log_connections = off
log_disconnections = off
log_parameter_max_length = 0           # never log bound parameter values
log_parameter_max_length_on_error = 0
log_timezone = 'UTC'
timezone = 'UTC'

shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
