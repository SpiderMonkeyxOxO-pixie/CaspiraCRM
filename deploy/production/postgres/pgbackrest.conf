# pgBackRest configuration (Backend Phase 13).
# Secrets are NOT in this file: pgbackrest-wrapper.sh exports the repository
# cipher passphrase and off-site credentials from Docker secret files.
[global]
# repo1: primary copy on the dedicated backup volume (separate from PGDATA).
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full=4
repo1-retention-full-type=count
repo1-retention-diff=14
repo1-bundle=y
repo1-block=y

# repo2: off-host, versioned object storage (a bucket with versioning or
# object lock, credentials that can write but not delete where the provider
# supports it). pgBackRest reads it from PGBACKREST_REPO2_* environment
# variables set in env/production.env (it does not expand variables in this
# file): PGBACKREST_REPO2_TYPE=s3, PGBACKREST_REPO2_S3_ENDPOINT,
# PGBACKREST_REPO2_S3_BUCKET, PGBACKREST_REPO2_S3_REGION, PGBACKREST_REPO2_PATH,
# PGBACKREST_REPO2_CIPHER_TYPE=aes-256-cbc, PGBACKREST_REPO2_RETENTION_FULL=8.
# Keys and the repo2 passphrase come from the backup_offsite_credentials secret.

compress-type=zst
compress-level=3
process-max=2
start-fast=y
archive-async=y
spool-path=/var/spool/pgbackrest
archive-push-queue-max=4GiB
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=detail

[caspira]
pg1-path=/var/lib/postgresql/data/pgdata
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
pg1-database=caspira_crm
