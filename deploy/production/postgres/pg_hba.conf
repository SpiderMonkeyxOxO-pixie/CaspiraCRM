# Caspira CRM production client authentication (Backend Phase 13).
# First match wins.
# TYPE  DATABASE        USER            ADDRESS         METHOD

# Superuser: local socket only, OS-user peer auth (db container and the
# backup agent, which shares the socket volume). Never over the network.
local   all             postgres                        peer
local   replication     postgres                        peer
host    all             postgres        0.0.0.0/0       reject
host    all             postgres        ::/0            reject

# Application roles over the internal data network, SCRAM only.
host    caspira_crm     caspira_app     0.0.0.0/0       scram-sha-256
host    caspira_crm     caspira_owner   0.0.0.0/0       scram-sha-256
host    caspira_crm     caspira_readonly 0.0.0.0/0      scram-sha-256
host    caspira_crm     caspira_monitor 0.0.0.0/0       scram-sha-256

# Everything else is refused.
local   all             all                             reject
host    all             all             0.0.0.0/0       reject
host    all             all             ::/0            reject
