# Caspira CRM reverse proxy (nginx-unprivileged, Backend Phase 13).
# The only public entry point: TLS termination, security headers, limits,
# rate limiting, request IDs and the maintenance switch.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Request limits
  client_max_body_size 4m;
  client_body_buffer_size 64k;
  client_header_buffer_size 4k;
  large_client_header_buffers 4 16k;
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 60s;

  # Access log with the request ID (forwarded to the API as X-Request-Id,
  # which the API adopts as its correlation ID). No query strings: they can
  # carry OAuth codes or tokens.
  log_format main escape=json '{"t":"$time_iso8601","rid":"$request_id","ip":"$remote_addr","m":"$request_method","p":"$uri","s":$status,"b":$body_bytes_sent,"rt":$request_time,"ut":"$upstream_response_time","ua":"$http_user_agent"}';
  access_log /dev/stdout main;

  # Rate limiting (per client address). The API applies its own limits too.
  limit_req_zone $binary_remote_addr zone=api:20m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=conn:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # Only this proxy's own client address is trusted; the API trusts exactly
  # one hop (TRUST_PROXY=1).
  map $http_upgrade $connection_upgrade { default upgrade; "" close; }

  upstream api { server api:4000; keepalive 32; }
  upstream web { server web:8080; keepalive 16; }

  # Local health endpoint for the container healthcheck (not published).
  server {
    listen 127.0.0.1:8081;
    location = /healthz { access_log off; return 200 "ok\n"; }
  }

  include /etc/nginx/conf.d/*.conf;
}
